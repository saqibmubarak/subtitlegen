[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitlegen"
version = "0.1.0"
description = "Cross-platform, extensible video subtitle generation pipeline"
readme = "ReadMe.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "av==17.0.1",
  "ctranslate2==4.7.2",
  "filelock==3.29.0",
  "faster-whisper==1.2.1",
  "numpy==2.4.6",
  "PyYAML==6.0.3",
  "typer==0.25.1",
]

[project.optional-dependencies]
cuda = []
mac = ["mlx-whisper==0.4.3"]
nemo = []
ocr = []
dev = [
  "hypothesis>=6,<7",
  "mypy>=1.17,<2",
  "pytest>=8,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
subtitlegen = "subtitlegen.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: tests that cross module boundaries",
  "model: tests that load local ML models",
  "benchmark: quality or performance benchmarks",
  "gpu: tests requiring an NVIDIA GPU",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["subtitlegen"]

[[tool.mypy.overrides]]
module = ["av", "ctranslate2", "faster_whisper", "mlx_whisper"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["subtitlegen"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
