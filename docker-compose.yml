# Job-oriented Compose file. Every service is behind a profile so a plain
# `docker compose up` starts nothing. Use:
#   windows  — Parakeet dialogue, then OCR titles (sequential, two images)
#   nemo     — Parakeet only
#   ocr      — Whisper + titles in the visual image
#   whisperx / subtitler — single-image jobs
x-subtitlegen-environment: &subtitlegen-environment
  HF_HOME: /models/huggingface
  PYTHONUNBUFFERED: "1"
  SUBTITLEGEN_PRESET: ${SUBTITLEGEN_PRESET:-quality}
  SUBTITLEGEN_CACHE_DIR: /cache
  SUBTITLEGEN_BACKEND: ${SUBTITLEGEN_BACKEND:-auto}
  SUBTITLEGEN_OVERWRITE: ${SUBTITLEGEN_OVERWRITE:-0}
  SUBTITLEGEN_VISUAL_PROBE_SECONDS: ${SUBTITLEGEN_VISUAL_PROBE_SECONDS:-4}
  SUBTITLEGEN_VISUAL_REFINE_SECONDS: ${SUBTITLEGEN_VISUAL_REFINE_SECONDS:-12}
  SUBTITLEGEN_ENRICH_GLOSSARY: ${SUBTITLEGEN_ENRICH_GLOSSARY:-1}

x-subtitlegen-volumes: &subtitlegen-volumes
  - ${VIDEO_HOST_PATH:-./videos}:/data/videos
  - ${MODEL_CACHE_HOST_PATH:-./model_cache}:/models
  - ${JOB_CACHE_HOST_PATH:-./.subtitlegen-docker}:/cache
  - ./config.ini:/app/config.ini:ro

x-gpu: &gpu
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: 1
          capabilities: [gpu]

x-parakeet: &parakeet
  image: subtitlegen-parakeet
  build:
    context: .
    args:
      PIP_EXTRAS: nemo
  environment:
    <<: *subtitlegen-environment
    # english-fast selects Parakeet. Do not also set BACKEND; the CLI forbids both.
    SUBTITLEGEN_PRESET: english-fast
    SUBTITLEGEN_BACKEND: auto
  volumes: *subtitlegen-volumes
  deploy:
    <<: *gpu
  init: true
  restart: "no"
  command: ["generate", "/data/videos", "--no-visual-text"]

x-visual: &visual
  image: subtitlegen-visual
  build:
    context: .
    args:
      APT_PACKAGES: ffmpeg libgl1
      PIP_EXTRAS: cuda,ocr
  environment:
    <<: *subtitlegen-environment
    PADDLE_PDX_CACHE_HOME: /models/paddle
    FLAGS_use_mkldnn: "0"
    FLAGS_enable_mkldnn: "0"
    FLAGS_enable_pir_api: "0"
    FLAGS_enable_pir_in_executor: "0"
  volumes: *subtitlegen-volumes
  deploy:
    <<: *gpu
  init: true
  restart: "no"
  command: ["generate", "/data/videos"]

services:
  subtitler:
    image: subtitlegen
    profiles: ["subtitler"]
    build:
      context: .
    environment:
      <<: *subtitlegen-environment
    volumes: *subtitlegen-volumes
    deploy:
      <<: *gpu
    init: true
    restart: "no"
    command: ["generate", "/data/videos"]

  whisperx:
    image: subtitlegen-whisperx
    profiles: ["whisperx"]
    build:
      context: .
      args:
        PIP_EXTRAS: cuda
    environment:
      <<: *subtitlegen-environment
      SUBTITLEGEN_PRESET: ${SUBTITLEGEN_PRESET:-quality}
    volumes: *subtitlegen-volumes
    deploy:
      <<: *gpu
    init: true
    restart: "no"
    command: ["generate", "/data/videos"]

  parakeet:
    <<: *parakeet
    profiles: ["nemo"]

  visual:
    <<: *visual
    profiles: ["ocr"]

  # Sequential Windows job: Parakeet SRT, then OCR ASS. Same images, not one container.
  windows-dialogue:
    <<: *parakeet
    profiles: ["windows"]

  windows-titles:
    <<: *visual
    profiles: ["windows"]
    depends_on:
      windows-dialogue:
        condition: service_completed_successfully
