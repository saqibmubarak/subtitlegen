services:
  subtitler:
    build: .
    environment:
      HF_HOME: /models/huggingface
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${VIDEO_HOST_PATH:-./videos}:/data/videos
      - ${MODEL_CACHE_HOST_PATH:-./model_cache}:/models
      - ${JOB_CACHE_HOST_PATH:-./.subtitlegen-docker}:/cache
      - ./config.ini:/app/config.ini:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: ["generate", "/data/videos", "--backend", "faster-whisper", "--cache-dir", "/cache"]

  whisperx:
    profiles: ["whisperx"]
    build:
      context: .
      dockerfile: Dockerfile.whisperx
    environment:
      HF_HOME: /models/huggingface
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${VIDEO_HOST_PATH:-./videos}:/data/videos
      - ${MODEL_CACHE_HOST_PATH:-./model_cache}:/models
      - ${JOB_CACHE_HOST_PATH:-./.subtitlegen-docker}:/cache
      - ./config.ini:/app/config.ini:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: ["generate", "/data/videos", "--preset", "quality", "--cache-dir", "/cache"]

  parakeet:
    profiles: ["nemo"]
    build:
      context: .
      dockerfile: Dockerfile.nemo
    environment:
      HF_HOME: /models/huggingface
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${VIDEO_HOST_PATH:-./videos}:/data/videos
      - ${MODEL_CACHE_HOST_PATH:-./model_cache}:/models
      - ${JOB_CACHE_HOST_PATH:-./.subtitlegen-docker}:/cache
      - ./config.ini:/app/config.ini:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: ["generate", "/data/videos", "--preset", "english-fast", "--cache-dir", "/cache"]

  visual:
    profiles: ["ocr"]
    build:
      context: .
      dockerfile: Dockerfile.ocr
    environment:
      HF_HOME: /models/huggingface
      PADDLE_PDX_CACHE_HOME: /models/paddle
      PYTHONUNBUFFERED: "1"
      FLAGS_use_mkldnn: "0"
      FLAGS_enable_mkldnn: "0"
      FLAGS_enable_pir_api: "0"
      FLAGS_enable_pir_in_executor: "0"
    volumes:
      - ${VIDEO_HOST_PATH:-./videos}:/data/videos
      - ${MODEL_CACHE_HOST_PATH:-./model_cache}:/models
      - ${JOB_CACHE_HOST_PATH:-./.subtitlegen-docker}:/cache
      - ./config.ini:/app/config.ini:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command:
      - generate
      - /data/videos
      - --preset
      - fast
      - --profile
      - one-piece
      - --visual-text
      - --cache-dir
      - /cache