x-subtitlegen-environment: &subtitlegen-environment
  HF_HOME: /models/huggingface
  PYTHONUNBUFFERED: "1"
  SUBTITLEGEN_PRESET: ${SUBTITLEGEN_PRESET:-quality}
  SUBTITLEGEN_CACHE_DIR: /cache
  SUBTITLEGEN_BACKEND: ${SUBTITLEGEN_BACKEND:-auto}
  SUBTITLEGEN_OVERWRITE: ${SUBTITLEGEN_OVERWRITE:-0}
  SUBTITLEGEN_VISUAL_PROBE_SECONDS: ${SUBTITLEGEN_VISUAL_PROBE_SECONDS:-4}
  SUBTITLEGEN_VISUAL_REFINE_SECONDS: ${SUBTITLEGEN_VISUAL_REFINE_SECONDS:-12}
  SUBTITLEGEN_ENRICH_GLOSSARY: ${SUBTITLEGEN_ENRICH_GLOSSARY:-1}

x-subtitlegen-volumes: &subtitlegen-volumes
  - ${VIDEO_HOST_PATH:-./videos}:/data/videos
  - ${MODEL_CACHE_HOST_PATH:-./model_cache}:/models
  - ${JOB_CACHE_HOST_PATH:-./.subtitlegen-docker}:/cache
  - ./config.ini:/app/config.ini:ro

x-gpu: &gpu
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: 1
          capabilities: [gpu]

services:
  subtitler:
    build: .
    environment:
      <<: *subtitlegen-environment
    volumes: *subtitlegen-volumes
    deploy:
      <<: *gpu
    command: ["generate", "/data/videos"]

  whisperx:
    profiles: ["whisperx"]
    build:
      context: .
      dockerfile: Dockerfile.whisperx
    environment:
      <<: *subtitlegen-environment
      SUBTITLEGEN_PRESET: ${SUBTITLEGEN_PRESET:-quality}
    volumes: *subtitlegen-volumes
    deploy:
      <<: *gpu
    command: ["generate", "/data/videos"]

  parakeet:
    profiles: ["nemo"]
    build:
      context: .
      dockerfile: Dockerfile.nemo
    environment:
      <<: *subtitlegen-environment
      SUBTITLEGEN_PRESET: english-fast
      SUBTITLEGEN_BACKEND: parakeet
    volumes: *subtitlegen-volumes
    deploy:
      <<: *gpu
    command: ["generate", "/data/videos", "--no-visual-text"]

  visual:
    profiles: ["ocr"]
    build:
      context: .
      dockerfile: Dockerfile.ocr
    environment:
      <<: *subtitlegen-environment
      PADDLE_PDX_CACHE_HOME: /models/paddle
      FLAGS_use_mkldnn: "0"
      FLAGS_enable_mkldnn: "0"
      FLAGS_enable_pir_api: "0"
      FLAGS_enable_pir_in_executor: "0"
    volumes: *subtitlegen-volumes
    deploy:
      <<: *gpu
    command: ["generate", "/data/videos"]
