[MODELS]
# Define available Whisper models. New models can be added here.
# Key: friendly_name = whisper_identifier (or local path to model)
tiny = tiny
base = base
small = small
medium = medium
# Added the recommended model for speed and accuracy (often fits in 8GB VRAM with INT8)
large-turbo = large-v3-turbo

[TRANSCRIPTION]
# 'auto' selects CUDA when available and CPU otherwise.
device = auto

# Which model to use from the [MODELS] section
model_name = large-turbo

# Language of the English dub, or 'None' for automatic detection.
language = en

# 'auto' selects float16 on CUDA and int8 on CPU.
compute_type = auto
beam_size = 5

# Keep one model loaded on an 8 GB GPU; batching happens within the backend.
parallel_workers = 1

[VAD]
min_silence_duration_ms = 500
speech_pad_ms = 200
max_speech_duration_s = 30

[CUES]
max_duration_seconds = 6
max_characters = 84
max_gap_seconds = 0.9
punctuation_flush_min_seconds = 1.5

[FILES]
# Supported video file extensions (comma-separated, case-insensitive)
video_extensions = .mp4, .mkv, .avi, .mov, .wmv